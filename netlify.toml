[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# ⚠️  Replace the URL below with your actual Render backend URL
[[redirects]]
  from   = "/api/*"
  to     = "https://mini-crm-server.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
